name: CI

on:
  push:
    branches:
      - main
      - master
      - fix/**
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Host typecheck
        run: npm run typecheck

      - name: Webview typecheck
        run: npm run typecheck:webview

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Production audit
        run: npm audit --omit=dev

      - name: VS Code smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode

      - name: Package VSIX
        if: runner.os == 'Linux'
        run: npm run package

      - name: Inspect VSIX contents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npx vsce ls
          unzip -l *.vsix
